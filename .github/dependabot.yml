version: 2
multi-ecosystem-groups:
  codeql:
    schedule:
      interval: monthly
    commit-message:
      prefix: ⬆
updates:
- package-ecosystem: uv
  directory: /
  schedule:
    interval: monthly
  cooldown:
    default-days: 7
  commit-message:
    prefix: ⬆
  ignore:
  - dependency-name: google-auth
  - dependency-name: grpcio
  - dependency-name: pydantic
  - dependency-name: redis

- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: daily
  cooldown:
    default-days: 7
  commit-message:
    prefix: ⬆
  ignore:
  - dependency-name: github/codeql-action

- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  cooldown:
    default-days: 7
  patterns:
  - github/codeql-action
  multi-ecosystem-group: codeql
