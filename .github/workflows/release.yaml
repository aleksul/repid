name: Release

on:
  release:
    types:
    - published
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Setup uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: false

    - name: Build
      run: uv build

    - name: Store distributions
      uses: actions/upload-artifact@v7.0.2
      with:
        name: distributions
        path: dist/
        if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Required for PyPI Trusted Publishing and signing attestations.
      id-token: write
    steps:
    - name: Download distributions
      uses: actions/download-artifact@v8.0.2
      with:
        name: distributions
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@v1.14.3
      with:
        attestations: true
