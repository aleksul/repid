name: Docs

on:
  pull_request:
    paths:
    - docs/**
    - zensical.toml
    - pyproject.toml
    - uv.lock
    - .github/workflows/docs.yml
  release:
    types:
    - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_docs:
    name: Build docs for review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Setup uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: false

    - name: Install docs dependencies
      run: uv sync --only-group docs --frozen --python 3.11

    - name: Build docs
      run: uv run --no-sync zensical build

  deploy_docs:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
        fetch-depth: 0
        persist-credentials: false

    - name: Setup git user
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com

    - name: Setup uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: false

    - name: Install docs dependencies
      run: uv sync --only-group docs --frozen --python 3.11

    - name: Build docs and commit the version locally
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      run: |
        uv run --no-sync mike deploy --update-aliases -- "${RELEASE_TAG#v}" latest

    - name: Publish docs
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh auth setup-git --hostname github.com
        git push origin gh-pages
