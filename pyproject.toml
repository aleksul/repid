[build-system]
build-backend = 'hatchling.build'
requires = ['hatchling', 'hatch-vcs']

[dependency-groups]
docs = [
  "zensical>=0.1.1",
  "mike @ git+https://github.com/squidfunk/mike.git"
]
lint = [
  "pyrefly>=1.4.1",
  "ruff>=0.17.3",
  "types-grpcio>=1.85.0.20261028",
  "types-aiobotocore[sqs]>=3.9.2"
]
prek = [
  "prek>=0.5.10"
]
tests = [
  "pytest>=9.2.0",
  "pytest-asyncio>=1.4.1",
  "pytest-timeout>=2.4.0",
  "coverage[toml]>=7.16.2",
  "httpx2>=2.13.0"
]

[project]
authors = [{ name = "aleksul", email = "me@aleksul.space" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Typing :: Typed"
]
dependencies = [
  "packaging>=22.0",
  "typing_extensions>=4.4.0; python_version < '3.12'"
]
description = "Repid is a simple, fast, and extensible async task queue framework, with built-in AsyncAPI 3.0 schema generation."
dynamic = ["version"]
license = { text = "MIT" }
name = "repid"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
amqp = []
kafka = ["aiokafka>=0.14.0,<0.16.0"]
nats = ["nats-py>=2.14.0,<3.0.0"]
pubsub = [
  "google-auth[requests]>=2.43.0,<3.0.0",
  "grpcio>=1.76.0,<2.0.0"
]
pydantic = ["pydantic>=2.0.0,<3.0.0"]
redis = ["redis>=7.0.0,<8.0.0"]
sqs = ["aiobotocore>=3.0.0,<4.0.0"]

[project.urls]
documentation = "https://repid.aleksul.space"
funding = "https://github.com/sponsors/aleksul"
repository = "https://github.com/aleksul/repid"
tracker = "https://github.com/aleksul/repid/issues"

[tool.coverage]

[tool.coverage.report]
exclude_lines = [
  '\.\.\.',
  'if TYPE_CHECKING:',
  'pragma: no cover'
]
fail_under = 100

[tool.coverage.run]
omit = ["repid/connections/rabbitmq/protocols.py", "repid/connections/kafka/protocols.py"]
source = ["repid"]

[tool.hatch.build.targets.wheel]
packages = ["repid"]

[tool.hatch.version]
source = "vcs"

[tool.markdownlint]
MD046 = false  # Code block style

[tool.markdownlint.MD013]
code_block_line_length = 100  # Number of characters for code blocks
code_blocks = true  # Include code blocks
headers = true  # Include headers
heading_line_length = 100  # Number of characters for headings
headings = true  # Include headings
line_length = 100  # Number of characters
stern = false  # Stern length checking
strict = false  # Strict length checking
tables = true  # Include tables

[tool.pyrefly]
check-unannotated-defs = true
ignore-missing-imports = ["aiokafka.*"]
infer-return-types = "never"
preset = "strict"
project-includes = ["repid", "tests"]
python-version = "3.11"
type-ignore-unknown-tag-behavior = "no-effect"

[tool.pyrefly.errors]
implicit-any-parameter = "error"
missing-import = "error"
no-any-return = "error"
unannotated-return = "error"
untyped-import = "error"
unused-ignore = "error"
unused-type-ignore = "error"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
markers = [
  "integration: marks integration tests",
  "integration_target(name): selects the broker or external tool an integration test uses"
]
timeout = 150
verbosity_assertions = 2

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["E501", "N999", "PLR0913"]
select = [
  "F",
  "E",
  "W",
  "C90",
  "I",
  "N",
  "UP",
  "YTT",
  "S",
  "BLE",
  "FBT",
  "B",
  "A",
  "COM",
  "C4",
  "T10",
  "ISC",
  "ICN",
  "G",
  "PIE",
  "T20",
  "PYI",
  "PT",
  "RET",
  "SIM",
  "TID",
  "ARG",
  "PTH",
  "PGH",
  "PL",
  "RUF"
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["PLC0414"]
"benchmarks/*" = ["T201", "S603", "S607"]
"repid/connections/__init__.py" = ["F401"]
"repid/connections/amqp/_uamqp/_encode.py" = ["FBT001", "FBT002"]
"repid/testing/__init__.py" = ["F401"]
"tests/*" = ["S", "PLR2004", "FBT", "BLE", "S101"]
