name: prek

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Setup uv
      uses: astral-sh/setup-uv@v10.3.3

    - name: Run prek
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        uv run --locked --only-group prek --python 3.11 prek run \
          --from-ref "$BASE_SHA" --to-ref HEAD --skip pyrefly --show-diff-on-failure
