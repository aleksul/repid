name: Tests

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and smoke-test package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Setup uv
      uses: astral-sh/setup-uv@v7.6.0

    - name: Build wheel and source distribution
      run: uv build --python 3.11

    - name: Install and import the wheel
      run: |
        uv run --isolated --no-project --python 3.11 --with dist/*.whl -- \
          python -I -c 'from repid import Repid; Repid()'

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
        - '3.15'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Setup uv
      uses: astral-sh/setup-uv@v7.6.0

    - name: Install test dependencies
      run: uv sync --frozen --all-extras --group tests --python ${{ matrix.python-version }}

    - name: Run tests
      run: uv run --no-sync coverage run -m pytest --color=yes tests/

    - name: Display coverage
      run: uv run --no-sync coverage report --no-skip-covered --show-missing --fail-under=0

    - name: Rename .coverage file
      run: |
        mkdir coverage
        mv .coverage ./coverage/.coverage.${{ runner.os }}-py${{ matrix.python-version }}

    - name: Store coverage files
      uses: actions/upload-artifact@v7.0.2
      with:
        name: coverage-${{ runner.os }}-py${{ matrix.python-version }}
        path: coverage
        include-hidden-files: true
        if-no-files-found: error

  coverage-combine:
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      percentage: ${{ steps.coverage.outputs.percentage }}

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Setup uv
      uses: astral-sh/setup-uv@v7.6.0

    - name: Get coverage files
      uses: actions/download-artifact@v8.0.2
      with:
        path: coverage
        pattern: coverage-*
        merge-multiple: true

    - name: Install coverage dependencies
      run: uv sync --frozen --only-group tests --python 3.11

    - name: Combine coverage and enforce the threshold
      run: |
        uv run --no-sync coverage combine coverage
        uv run --no-sync coverage report --format=markdown --skip-covered --show-missing \
          >> "$GITHUB_STEP_SUMMARY"

    - name: Get coverage percentage for badge
      id: coverage
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      run: |
        uv run --no-sync coverage json
        percentage=$(uv run --no-sync python -c \
          'import json; print(json.load(open("coverage.json"))["totals"]["percent_covered_display"])')
        echo "percentage=$percentage" >> "$GITHUB_OUTPUT"

  coverage-badge:
    needs: coverage-combine
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - name: Generate Coverage Badge
      env:
        COVERAGE: ${{ needs.coverage-combine.outputs.percentage }}
      run: |
        if [ "$COVERAGE" -ge 95 ]; then
          color=brightgreen
        elif [ "$COVERAGE" -ge 80 ]; then
          color=yellowgreen
        else
          color=red
        fi
        mkdir -p badges
        curl --fail --silent --show-error --retry 3 \
          "https://img.shields.io/badge/coverage-${COVERAGE}%25-${color}" -o badges/coverage.svg

    - name: Publish Coverage Badge
      uses: peaceiris/actions-gh-pages@v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./badges
        publish_branch: gh-pages
        destination_dir: badges
        keep_files: true
