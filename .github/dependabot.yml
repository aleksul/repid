version: 2
updates:
- package-ecosystem: uv
  directory: /
  schedule:
    interval: monthly
  cooldown:
    default-days: 7
  commit-message:
    prefix: ⬆
  groups:
    python-packages:
      patterns: ['*']

- package-ecosystem: pre-commit
  directory: /
  schedule:
    interval: monthly
  cooldown:
    default-days: 7
  commit-message:
    prefix: ⬆
  groups:
    python-packages:
      patterns: ['*']

- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  cooldown:
    default-days: 7
  commit-message:
    prefix: ⬆
  groups:
    github-actions:
      patterns: ['*']
